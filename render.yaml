# A persistent disk requires a paid Render plan. Review pricing before creating.
services:
  - type: web
    name: brm-bike-rental-departure-board
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm test && npm run lint && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: brm-reservations
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: BOARD_MODE
        value: live
      - key: DATABASE_PATH
        value: /var/data/reservations.sqlite
      - key: BRM_TIME_ZONE
        value: Europe/Rome
      - key: BRM_NAMESPACE
        sync: false
      - key: WEBHOOK_URL_TOKEN
        generateValue: true
      - key: BOARD_USERNAME
        value: board
      - key: BOARD_PASSWORD
        generateValue: true
