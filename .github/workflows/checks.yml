name: PHP checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
          coverage: none
      - run: find app config public scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php
      - run: php tests/http.php
